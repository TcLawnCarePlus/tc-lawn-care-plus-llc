# Render Blueprint for TC Lawn Care Plus LLC.
# Deploy with: Render dashboard -> New -> Blueprint -> point it at the repo
# containing this file. Or create the web service by hand with the same
# settings (see README.md). Nothing here deploys by itself.
services:
  - type: web
    name: tc-lawn-care-plus-llc
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tc-lawn-care-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DING_TO
        sync: false
databases:
  - name: tc-lawn-care-db
    plan: free
    databaseName: tclawncare
    user: tclawncare
